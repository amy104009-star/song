<title>北村歌單</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #56350e; background: #fff5cd; }

  .playlist-marquee { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; padding: .45rem .6rem; border: 1px solid #e3ba6b; border-radius: .85rem; background: #fff4cbe8; }

  .artist-directory summary:focus-visible { outline: 3px solid #966514; outline-offset: 2px; }

  .artist-directory-columns > [data-artist] { grid-column: 1 / -1; justify-self: start; }

  .song-genre { margin-inline-start: .35rem; background: #fff0c8; }
  .card p, small { color: #735018; }

  @keyframes shuffle-pulse { from { opacity: .55; transform: translateY(3px); } to { opacity: 1; transform: translateY(-2px); } }
  #draw-result.reveal { animation: draw-reveal .25s ease-out; }
  @keyframes draw-reveal { from { opacity: .45; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { #draw-result.reveal, #draw-preview-title { animation: none; } }
  .draw-history { padding: .65rem .8rem; border: 1px solid #e3ba6b; border-radius: .75rem; }
  .draw-history summary { cursor: pointer; font-weight: 650; }
  .draw-history summary:focus-visible { outline: 3px solid #966514; outline-offset: 3px; }
  .draw-history ol { max-height: 12rem; overflow: auto; margin: .5rem 0 0; padding-inline-start: 1.65rem; }
  .draw-history li { padding-block: .3rem; overflow-wrap: anywhere; }
  #draw-result:empty, [hidden] { display: none !important; }
  #admin-list { display: grid; gap: .5rem; max-height: min(35vh, 21rem); overflow: auto; }
  #admin-list li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; }
  #admin-list li > div { min-width: 0; overflow-wrap: anywhere; }
  .status { color: #684710; }
  .bubbles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
  }

  /* Bubble element */
  .bubble {
    position: fixed;
    bottom: -50px;
    opacity: 0.8;
  }

  /* Float up animation - straight up */
  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-100vh) translateX(0);
      opacity: 0;
    }
  }

  /* Float up with sway - up with left-right movement */
  @keyframes floatUpSway {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0.8;
    }
    25% {
      transform: translateY(-25vh) translateX(30px) rotate(90deg);
      opacity: 0.8;
    }
    50% {
      transform: translateY(-50vh) translateX(-20px) rotate(180deg);
      opacity: 0.8;
    }
    75% {
      transform: translateY(-75vh) translateX(25px) rotate(270deg);
      opacity: 0.4;
    }
    100% {
      transform: translateY(-100vh) translateX(0) rotate(360deg);
      opacity: 0;
    }
  }

  /* Float up left - up and to the left */
  @keyframes floatUpLeft {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0.8;
    }
    50% {
      transform: translateY(-50vh) translateX(-40px) rotate(180deg);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-100vh) translateX(-80px) rotate(360deg);
      opacity: 0;
    }
  }

  .cards .card { background: #fffdf7bb; }
  @media (prefers-reduced-motion: reduce) {
    .bubbles-container { display: none; }
  }

function updateOptions() {
  const names = [...new Set(songs.flatMap(artists))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
  for (const id of ["artist", "scope"]) {
    const select = $(id);
    const value = select.value;
    select.replaceChildren(new Option(id === "artist" ? "全部歌手" : "全部歌曲", ""), ...names.map((name) => new Option(name, name)));
    select.value = names.includes(value) ? value : "";
  }
  const artistCounts = new Map();
  for (const song of songs) {
    for (const artist of new Set(artists(song))) artistCounts.set(artist, (artistCounts.get(artist) ?? 0) + 1);
  }
  const prioritized = [...names].sort((a, b) => artistCounts.get(b) - artistCounts.get(a));
  const artistButton = (name) => {
    const choice = button(name || "全部歌手", () => {
      $("artist").value = name;
      renderSongs();
    });
    choice.dataset.artist = name;
    return choice;
  };
  const remaining = new Set(prioritized);
  const groups = [];
  for (const [label, members] of artistCategories) {
    const groupNames = prioritized.filter((name) => members.has(name));
    groupNames.forEach((name) => remaining.delete(name));
    groups.push([label, groupNames]);
  }
  if (remaining.size) groups.push(["資料待確認", [...remaining]]);
  const directory = $("artist-buttons");
  const expanded = new Set([...directory.querySelectorAll(".artist-category:not([hidden])")].map((group) => group.dataset.category));
  const toggles = [];
  const panels = [];
  for (const [label, members] of groups.filter(([, members]) => members.length)) {
    const group = element("section", undefined, "artist-category");
    group.dataset.category = label;
    group.id = "artist-category-" + panels.length;
    group.hidden = !expanded.has(label);
    const heading = element("h3", label);
    heading.id = group.id + "-title";
    group.setAttribute("aria-labelledby", heading.id);
    const toggle = button(label, () => {
      const opening = group.hidden;
      for (const [index, panel] of panels.entries()) {
        const active = opening && panel === group;
        panel.hidden = !active;
        toggles[index].setAttribute("aria-expanded", String(active));
      }
    });
    toggle.className = "artist-category-toggle";
    toggle.setAttribute("aria-controls", group.id);
    toggle.setAttribute("aria-expanded", String(!group.hidden));
    const choices = element("div", undefined, "artist-buttons filter-chips");
    choices.append(...members.map(artistButton));
    group.append(heading, choices);
    toggles.push(toggle);
    panels.push(group);
  }
  directory.replaceChildren(artistButton(""), ...toggles, ...panels);
}

function button(label, onClick) {
  const node = element("button", label);
  node.type = "button";
  node.addEventListener("click", onClick);
  return node;
}

function copySongTitle(song) {
  const label = `複製歌名：${song.title}`;
  let reset;
  const copy = button("", async () => {
    let feedback;
    try {
      await navigator.clipboard.writeText(song.title);
      feedback = "success";
    } catch {
      feedback = "error";
    }
    copy.dataset.feedback = feedback;
    copy.setAttribute("aria-label", feedback === "success" ? `已複製：${song.title}` : `複製失敗：${song.title}`);
    clearTimeout(reset);
    reset = setTimeout(() => {
      delete copy.dataset.feedback;
      copy.setAttribute("aria-label", label);
    }, 1800);
  });
  copy.className = "copy-song-title";
  copy.title = "複製歌名";
  copy.setAttribute("aria-label", label);
  const icon = element("span", undefined, "copy-icon");
  icon.setAttribute("aria-hidden", "true");
  copy.append(icon);
  return copy;
}

function favoriteSong(song) {
  const control = button("", () => {
    if (favorites.has(song.id)) favorites.delete(song.id);
    else favorites.add(song.id);
    try { localStorage.setItem(favoritesKey, JSON.stringify([...favorites])); } catch {}
    for (const node of document.querySelectorAll(`[data-favorite-id="${song.id}"]`)) update(node);
    if (filters.favorites) renderSongs();
  });
  function update(node) {
    const active = favorites.has(song.id);
    node.textContent = active ? "♥" : "♡";
    node.setAttribute("aria-pressed", String(active));
  }
  control.className = "favorite-song";
  control.dataset.favoriteId = song.id;
  control.setAttribute("aria-label", "收藏 " + song.title);
  update(control);
  return control;
}

function renderSongCard(song, compactTags = false) {
  const item = element("li", undefined, "card");
  const title = element("div", undefined, "song-title-row");
  const actions = element("span", undefined, "song-card-actions");
  actions.append(copySongTitle(song), favoriteSong(song));
  title.append(element("strong", song.title), actions);
  item.append(title, element("p", song.artist));
  const labels = [element("span", song.language || "未分類", "song-language")];
  if (song.genre) labels.push(element("span", song.genre, "song-language song-genre"));
  if (compactTags) {
    const tags = element("div", undefined, "song-tags");
    tags.append(...labels);
    item.append(tags);
  } else {
    item.append(...labels);
  }
  return item;
}

function renderAnnouncements() {
  clearTimeout(announcementTimer);
  const remaining = announcements.lastAddedAt + announcementDays - Date.now();
  const songsById = new Map(songs.map((song) => [song.id, song]));
  const recent = remaining > 0
    ? [...announcements.ids].reverse().map((id) => songsById.get(id)).filter(Boolean)
    : [];
  if (remaining > 0) {
    announcementTimer = setTimeout(renderAnnouncements, Math.min(remaining, 2_147_483_647));
  }
  $("no-new-songs").hidden = recent.length > 0;
  $("new-songs").replaceChildren(...recent.map((song) => renderSongCard(song)));
}

function renderSongs() {
  for (const [id, current] of [["language-buttons", filters.language], ["genre-buttons", filters.genre]]) {
    for (const choice of $(id).children) {
      choice.setAttribute("aria-pressed", String(choice.dataset.value === current));
    }
  }
  const group = $("artist").value;
  for (const choice of $("artist-buttons").querySelectorAll("[data-artist]")) {
    choice.setAttribute("aria-pressed", String(choice.dataset.artist === group));
  }
  const { language, genre } = filters;
  const active = Boolean(group || language || genre || filters.favorites || $("search").value.trim());
  const visible = songs.filter((song) =>
    (!filters.favorites || favorites.has(song.id)) &&
    (!group || artists(song).includes(group)) && (!genre || song.genre === genre) &&
    (!language || (song.language || "未分類") === language) && matches(song, $("search"))
  );
  $("count").textContent = visible.length ? `共 ${visible.length} 首歌` : "找不到歌曲";
  $("library-title").textContent = filters.favorites ? "我的收藏" : active ? "搜尋結果" : "全部歌曲";
  $("favorite-filter").setAttribute("aria-pressed", String(filters.favorites));
  $("songs-empty").textContent = filters.favorites && !favorites.size ? "點歌曲旁的愛心，就能加入收藏。" : "沒有符合的歌曲。可以換個關鍵字，或清除篩選再試。";
  $("clear-filters").hidden = !active;
  $("songs-empty").hidden = visible.length > 0;
  const groups = new Map();
  for (const song of visible) {
    const group = isEnglishTitle(song.title) ? englishGroup : titleLength(song.title);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(song);
  }
  const sections = [...groups.entries()].sort(([a], [b]) => groupOrder(a) - groupOrder(b));
  $("songs").replaceChildren(...sections.map(([group, entries]) => {
    const section = element("section", undefined, "song-group");
    const heading = element("h3", group === englishGroup ? "英文歌名" : group ? `${group} 字` : "其他");
    const cards = element("ul", undefined, "cards");
    cards.append(...entries.map((song) => renderSongCard(song, true)));
    section.append(heading, cards);
    return section;
  }));
}

function pool() {
  const scope = $("scope").value;
  return scope ? songs.filter((song) => artists(song).includes(scope)) : songs;
}

function renderDraw() {
  const remaining = pool().length - (history.get($("scope").value)?.size ?? 0);

}

      fortuneRecord = { date, version: fortuneVersion ?? 0, index: Math.floor(Math.random() * fortunes.length) };
      try { localStorage.setItem(fortuneKey, JSON.stringify(fortuneRecord)); } catch {}
    }
    fortuneButton.disabled = false;
    fortuneShaker.hidden = true;
    renderFortune();
    if ($("site-menu").open && $("daily-fortune").open && document.activeElement === document.body) {
      fortuneResult.focus();
    }
  }, fortuneShakeDuration);
});
async function refreshFortuneVersion() {
  try {
    const response = await fetch("https://lili-songbook.easyarena3.chatgpt.site/api/fortune-reset", {
      cache: "no-store", signal: AbortSignal.timeout(2500),
    });
    if (!response.ok) return;
    const { version, visible } = await response.json();
    fortunePanel.hidden = visible === false;
    if (fortunePanel.hidden) fortunePanel.open = false;
    if (Number.isSafeInteger(version) && version >= 0) fortuneVersion = Math.max(fortuneVersion ?? 0, version);
  } catch {}
}

async function syncFortune() {
  renderFortune();
  await refreshFortuneVersion();
  renderFortune();
}
fortunePanel.addEventListener("toggle", (event) => {
  if (event.currentTarget.open) void syncFortune();
});
$("open-site-menu").addEventListener("click", () => {
  void syncFortune();
});

const wishlistApi = "https://lili-songbook.easyarena3.chatgpt.site/api/wishlist";
const wishlistSnapshot = JSON.parse($("wishlist-data").textContent);
const snapshotPhotos = new Map(wishlistSnapshot.map(({ id, photoVersion = 0, photo }) => [`${id}:${photoVersion}`, photo]));
function renderPublicWishlist(gifts) {
  const cards = gifts.slice(0, 3).map(({ id, name, coins, zoom = 100, x = 0, y = 0, photoVersion = 0 }) => {
    const gift = element("li", undefined, "wishlist-gift");
    const image = element("img");
    image.src = snapshotPhotos.get(`${id}:${photoVersion}`) ?? `${wishlistApi}/${id}/photo?v=${photoVersion}`;
    image.alt = "";
    image.loading = "lazy";
    const frame = element("div", undefined, "wishlist-photo-frame");
    if ([zoom, x, y].every(Number.isInteger)) {
      const scale = zoom / 100;
      const extra = (scale - 1) / 2;
      frame.style.setProperty("--gift-extra-top", Math.max(0, extra - y / 100));
      frame.style.setProperty("--gift-extra-bottom", Math.max(0, extra + y / 100));
      image.style.transform = `translate(${x}%, ${y}%) scale(${scale})`;
    }
    frame.append(image);
    const price = element("span");
    const coin = element("i", undefined, "wishlist-coin");
    coin.setAttribute("aria-hidden", "true");
    price.append(coin, `${coins.toLocaleString("zh-TW")} 金幣`);
    gift.append(frame, element("strong", name), price);
    return gift;
  });
  $("wishlist-gifts").replaceChildren(...cards);
  $("playlist-wishlist").hidden = !cards.length;
}
renderPublicWishlist(wishlistSnapshot);

async function loadPublicWishlist() {
  try {
    const response = await fetch(wishlistApi, { cache: "no-store", signal: AbortSignal.timeout(5000) });
    if (!response.ok) return;
    const { gifts } = await response.json();
    if (Array.isArray(gifts)) renderPublicWishlist(gifts);
  } catch {}
}
void loadPublicWishlist();

const siteMenu = $("site-menu");
$("open-site-menu").addEventListener("click", () => siteMenu.showModal());
$("close-site-menu").addEventListener("click", () => siteMenu.close());
siteMenu.addEventListener("click", (event) => {
  if (event.target === siteMenu) siteMenu.close();
});
$("artist").addEventListener("change", renderSongs);
function renderLanguageFilters() {
  if (hiddenLanguages.includes(filters.language)) filters.language = "";
  mountChips("language-buttons", languageOptions.filter((language) => !hiddenLanguages.includes(language)), "language", "全部語言");
}

renderLanguageFilters();
mountChips("genre-buttons", genreOptions, "genre", "全部曲風");
$("open-draw").addEventListener("click", () => $("draw").showModal());
document.querySelectorAll("[data-close]").forEach((node) => {
  node.addEventListener("click", () => $(node.dataset.close).close());
});
$("scope").addEventListener("change", () => { result = null; renderDraw(); });
$("reset-draw").addEventListener("click", () => {
  history.clear();
  drawLog.length = 0;
  $("draw-history-list").replaceChildren();
  $("draw-history-count").textContent = "（0）";
  $("draw-history-empty").hidden = false;
  result = null;
  renderDraw();
});
function stopDrawAnimation() {
  if (!drawFrame) return;
  cancelAnimationFrame(drawFrame);
  drawFrame = 0;
  $("draw-preview").hidden = true;
  $("scope").disabled = false;
  renderDraw();
}

$("draw").addEventListener("close", stopDrawAnimation);
$("draw-button").addEventListener("click", () => {
  if (drawFrame) return;
  const scope = $("scope").value;
  const all = pool();
  if (!all.length) return;
  const previous = history.get(scope);
  const unseen = all.filter((song) => !previous?.has(song.id));
  const newRound = unseen.length === 0;
  const candidates = newRound ? all : unseen;
  const song = candidates[Math.floor(Math.random() * candidates.length)];

  function finish() {
    const drawn = newRound ? new Set() : previous ?? new Set();
    drawn.add(song.id);
    history.set(scope, drawn);
    result = { song, newRound };
    drawLog.push(song);
    $("draw-history-count").textContent = `（${drawLog.length}）`;
    $("draw-history-empty").hidden = true;
    const entry = element("li");
    const title = element("div", undefined, "song-title-row");
    title.append(element("span", `${song.title} — ${song.artist}`), copySongTitle(song));
    entry.append(title);
    $("draw-history-list").prepend(entry);
    renderDraw();
    $("draw-result").classList.add("reveal");
  }

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    finish();
    return;
  }

  $("draw-button").textContent = "抽選中…";
  $("draw-button").disabled = true;
  $("reset-draw").disabled = true;
  $("scope").disabled = true;
  $("draw-result").replaceChildren();
  $("draw-preview").hidden = false;
  const started = performance.now();
  let lastChange = -100;
  function shuffle(now) {
    if (!$("draw").open) {
      stopDrawAnimation();
      return;
    }
    const elapsed = now - started;
    if (elapsed >= drawDuration) {
      stopDrawAnimation();
      finish();
      return;
    }
    if (elapsed - lastChange >= 100 + 600 * (elapsed / drawDuration) ** 2) {
      lastChange = elapsed;
      const preview = candidates[Math.floor(Math.random() * candidates.length)];
      $("draw-preview-title").textContent = preview.title;
    }
    drawFrame = requestAnimationFrame(shuffle);
  }
  $("draw-preview-title").textContent = candidates[0].title;
  drawFrame = requestAnimationFrame(shuffle);
});
function renderMarquee(message, suffix = "") {
  const bar = $("playlist-marquee" + suffix);
  const text = $("marquee-text" + suffix);
  const value = message.trim().replace(/\s+/g, " ");
  if (text.textContent !== value) {
    text.textContent = value;
    text.style.setProperty("--scroll-time", `${Math.max(14, 11 + Array.from(value).length * .25)}s`);
  }
  bar.hidden = !value;
}

renderMarquee(JSON.parse($("playlist-message-data").textContent));
renderMarquee(JSON.parse($("playlist-message-two-data").textContent), "-two");
function renderMarqueeStyle(style) {
  const { dataset } = $("playlist-marquee");
  dataset.height = style.height;
  dataset.size = style.size;
  dataset.font = style.font;
}
renderMarqueeStyle(JSON.parse($("marquee-style-data").textContent));
function renderDailyPicks(board) {
  const display = Array.isArray(board?.picks) && board.picks.length === 5;
  $("daily-picks").hidden = !display;
  if (!display) return;
  const date = new Date(board.updatedAt);
  const format = new Intl.DateTimeFormat("zh-TW", { dateStyle: "medium", timeZone: "Asia/Taipei" });
  $("daily-picks-date").dateTime = date.toISOString();
  $("daily-picks-date").textContent = format.format(date);
  $("daily-picks-list").replaceChildren(...board.picks.map((song) => {
    const item = element("li", undefined, "card");
    item.append(element("strong", song.title), element("p", song.artist));
    return item;
  }));
}
renderDailyPicks(JSON.parse($("daily-picks-data").textContent));

updateOptions();
renderAnnouncements();
renderSongs();
renderDraw();

async function loadLatestSongs() {
  try {
    const response = await fetch("https://lili-songbook.easyarena3.chatgpt.site/api/songs", {
      credentials: "omit",
      signal: AbortSignal.timeout(4500),
    });
    if (!response.ok) return;
    const { songs: latest, announcements: notice, message, messageTwo, marqueeStyle, dailyPicks, hiddenLanguages: settings } = await response.json();
    if (typeof message === "string") renderMarquee(message);
    if (typeof messageTwo === "string") renderMarquee(messageTwo, "-two");
    if (marqueeStyle) renderMarqueeStyle(marqueeStyle);
    if (dailyPicks !== undefined) renderDailyPicks(dailyPicks);
    if (!Array.isArray(latest) || !latest.every((song) => song &&
      Number.isSafeInteger(song.id) && typeof song.title === "string" &&
      typeof song.artist === "string") ||
      new Set(latest.map((song) => song.id)).size !== latest.length ||
      !notice || !Number.isSafeInteger(notice.lastAddedAt) || !Array.isArray(notice.ids) ||
      !notice.ids.every(Number.isSafeInteger)) return;
    if (Array.isArray(settings) && JSON.stringify(settings) !== JSON.stringify(hiddenLanguages)) {
      hiddenLanguages = settings;
      renderLanguageFilters();
    }
    announcements = notice;
    if (JSON.stringify(latest) === JSON.stringify(songs)) {
      renderSongs();
      renderAnnouncements();
      return;
    }
    stopDrawAnimation();
    songs = latest;
    history.clear();
    result = null;
    updateOptions();
    renderAnnouncements();
    renderSongs();
    renderDraw();
  } catch {
    // Show the published snapshot if the live source is unreachable.
  }
}

void loadLatestSongs();
