<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>璃璃歌單</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #56350e; background: #fff5cd; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; background: linear-gradient(135deg, #fff8dc, #fffacd 50%, #ffe4b5); }
  main { position: relative; width: min(100% - 2rem, 66rem); margin: auto; padding: 2rem 0 3rem; }
  header { text-align: center; margin-bottom: 1.5rem; }
  h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: .2em 0 .4em; }
  h2, p { margin: 0; }
  label { display: grid; gap: .35rem; font-weight: 650; min-width: 0; }
  button, input, select, textarea { font: inherit; color: inherit; min-height: 2.75rem; padding: .55rem .8rem; border: 1px solid #e3ba6b; border-radius: .75rem; background: #fffdf4; }
  input, select, textarea { width: 100%; }
  textarea { resize: vertical; }
  button { font-weight: 650; cursor: pointer; }
  button:hover { background: #fff1b8; }
  button:disabled { opacity: .45; cursor: default; }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #966514; outline-offset: 2px; }
  .primary { background: #ffda72; border-color: #dbad40; }
  .primary:hover { background: #ffd259; }
  #open-draw { font-size: 1.15rem; padding-inline: 1.25rem; border-radius: 1rem; box-shadow: 0 .3rem 1rem #92561026; }
  .actions, .filters { display: flex; flex-wrap: wrap; gap: .65rem; align-items: end; }
  header .actions { justify-content: center; }
  .filters > label { flex: 1 1 13rem; }
  .count { margin: .8rem 0; }
  .artist-buttons { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: 1rem; }
  .artist-buttons button { border-radius: 999px; overflow-wrap: anywhere; max-width: 100%; }
  .artist-buttons button[aria-pressed="true"] { background: #ffda72; border-color: #a36d20; }
  ul { list-style: none; padding: 0; margin: 0; }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; }
  @media (min-width: 56rem) { .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card { background: #fffdf7; border: 1px solid #f0d48e; border-radius: .85rem; padding: .75rem; min-width: 0; overflow-wrap: anywhere; }
  .card p, small { color: #735018; }
  dialog { width: min(100% - 2rem, 34rem); max-height: calc(100dvh - 2rem); border: 1px solid #e3ba6b; border-radius: 1rem; padding: 0; background: #fffdf4; color: inherit; box-shadow: 0 1rem 3rem #4c2a2039; }
  dialog::backdrop { background: #35250c70; }
  .dialog-heading { padding: 1rem; background: #ffe596; }
  .dialog-body { display: grid; gap: .85rem; padding: 1rem; }
  #draw-result { background: #fff1bc; border-radius: .85rem; padding: 1rem; text-align: center; overflow-wrap: anywhere; }
  #draw-result:empty, [hidden] { display: none !important; }
  #admin-list { display: grid; gap: .5rem; max-height: min(35vh, 21rem); overflow: auto; }
  #admin-list li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; }
  #admin-list li > div { min-width: 0; overflow-wrap: anywhere; }
  .status { color: #684710; }
  .bubbles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
  }

  /* Bubble element */
  .bubble {
    position: fixed;
    bottom: -50px;
    opacity: 0.8;
  }

  /* Float up animation - straight up */
  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-100vh) translateX(0);
      opacity: 0;
    }
  }

  /* Float up with sway - up with left-right movement */
  @keyframes floatUpSway {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0.8;
    }
    25% {
      transform: translateY(-25vh) translateX(30px) rotate(90deg);
      opacity: 0.8;
    }
    50% {
      transform: translateY(-50vh) translateX(-20px) rotate(180deg);
      opacity: 0.8;
    }
    75% {
      transform: translateY(-75vh) translateX(25px) rotate(270deg);
      opacity: 0.4;
    }
    100% {
      transform: translateY(-100vh) translateX(0) rotate(360deg);
      opacity: 0;
    }
  }

  /* Float up left - up and to the left */
  @keyframes floatUpLeft {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0.8;
    }
    50% {
      transform: translateY(-50vh) translateX(-40px) rotate(180deg);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-100vh) translateX(-80px) rotate(360deg);
      opacity: 0;
    }
  }

  .cards .card { background: #fffdf7bb; }
  @media (prefers-reduced-motion: reduce) {
    .bubbles-container { display: none; }
  }
</style>
</head>
<body>
<div id="floating-background" class="bubbles-container" aria-hidden="true"></div>
<main>
  <header>
    <h1>🌙 璃璃歌單 🧸</h1>
    <div class="actions">
      <button id="open-draw" class="primary">🎲 隨機選歌</button>
    </div>
  </header>
  <div class="filters">
    <label>搜尋歌曲或歌手<input id="search" type="search" placeholder="輸入歌名或歌手"></label>
    <label>歌手分類<select id="artist"></select></label>
    <label>歌曲範圍
      <select id="recent">
        <option value="">全部歌曲</option>
        <option value="latest">新加入歌曲（最近 10 首）</option>
      </select>
    </label>
  </div>
  <div class="artist-buttons" id="artist-buttons" role="group" aria-label="快速選擇歌手"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="cards" id="songs"></ul>
</main>
<dialog id="draw" aria-labelledby="draw-heading">
  <h2 id="draw-heading" class="dialog-heading">🎲 隨機選歌</h2>
  <div class="dialog-body">
    <label>抽選範圍<select id="scope"></select></label>
    <div aria-live="polite" aria-atomic="true">
      <div id="draw-result"></div>
      <p id="remaining"></p>
    </div>
    <div class="actions">
      <button class="primary" id="draw-button">抽一首</button>
      <button id="reset-draw">清除抽歌紀錄</button>
      <button data-close="draw">關閉</button>
    </div>
  </div>
</dialog>

<script type="module">
const $ = (id) => document.getElementById(id);
const floatAnimations = ["floatUp", "floatUpSway", "floatUpLeft"];
const floatingItems = Array.from({ length: 25 }, (_, index) => {
  const item = document.createElement("span");
  item.className = "bubble";
  item.textContent = index % 2 === 0 ? "🌙" : "🧸";
  item.style.left = `${Math.random() * 100}%`;
  item.style.fontSize = `${0.8 + Math.random() * 1.5}rem`;
  const animation = floatAnimations[index % floatAnimations.length];
  const duration = 12 + Math.random() * 11;
  item.style.animation = `${animation} ${duration}s linear ${-Math.random() * duration}s infinite`;
  return item;
});
$("floating-background").append(...floatingItems);

const seed = JSON.parse($("seed").textContent);
const history = new Map();
let songs = seed;
let result = null;

function element(tag, content, className) {
  const node = document.createElement(tag);
  if (content !== undefined) node.textContent = content;
  if (className) node.className = className;
  return node;
}

function artists(song) {
  return song.artist.split(/[\/,&]/).map((name) => name.trim()).filter(Boolean);
}

function matches(song, input) {
  const query = input.value.trim().toLocaleLowerCase();
  return [song.title, song.artist].some((value) => value.toLocaleLowerCase().includes(query));
}

function updateOptions() {
  const names = [...new Set(songs.flatMap(artists))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
  for (const id of ["artist", "scope"]) {
    const select = $(id);
    const value = select.value;
    select.replaceChildren(new Option("全部歌曲", ""), ...names.map((name) => new Option(name, name)));
    select.value = names.includes(value) ? value : "";
  }
  $("artist-buttons").replaceChildren(...["", ...names].map((name) => {
    const choice = button(name || "全部歌曲", () => {
      $("artist").value = name;
      renderSongs();
    });
    choice.dataset.artist = name;
    return choice;
  }));
}

function button(label, onClick) {
  const node = element("button", label);
  node.type = "button";
  node.addEventListener("click", onClick);
  return node;
}

function renderSongs() {
  const group = $("artist").value;
  for (const choice of $("artist-buttons").children) {
    choice.setAttribute("aria-pressed", String(choice.dataset.artist === group));
  }
  const selection = $("recent").value === "latest" ? songs.slice(-10).reverse() : songs;
  const visible = selection.filter((song) =>
    (!group || artists(song).includes(group)) && matches(song, $("search"))
  );
  $("count").textContent = visible.length ? `共 ${visible.length} 首歌` : "找不到歌曲";
  $("songs").replaceChildren(...visible.map((song) => {
    const item = element("li", undefined, "card");
    item.append(element("strong", song.title), element("p", song.artist));
    return item;
  }));
}

function pool() {
  const scope = $("scope").value;
  return scope ? songs.filter((song) => artists(song).includes(scope)) : songs;
}

function renderDraw() {
  const remaining = pool().length - (history.get($("scope").value)?.size ?? 0);
  $("remaining").textContent = pool().length ? `本輪剩餘 ${remaining} / ${pool().length} 首` : "目前沒有可抽選的歌曲";
  $("draw-button").textContent = result ? "再抽一首" : "抽一首";
  $("draw-button").disabled = pool().length === 0;
  $("reset-draw").disabled = history.size === 0;
  const panel = $("draw-result");
  panel.replaceChildren();
  if (result) {
    panel.append(element("h2", result.song.title), element("p", result.song.artist),
      element("small", `分類（歌手） ${artists(result.song).join("、")}`));
    if (result.newRound) panel.append(element("p", "已開始新一輪"));
  }
}

$("search").addEventListener("input", renderSongs);
$("artist").addEventListener("change", renderSongs);
$("recent").addEventListener("change", renderSongs);
$("open-draw").addEventListener("click", () => $("draw").showModal());
document.querySelectorAll("[data-close]").forEach((node) => {
  node.addEventListener("click", () => $(node.dataset.close).close());
});
$("scope").addEventListener("change", () => { result = null; renderDraw(); });
$("reset-draw").addEventListener("click", () => {
  history.clear();
  result = null;
  renderDraw();
});
$("draw-button").addEventListener("click", () => {
  const scope = $("scope").value;
  const all = pool();
  if (!all.length) return;
  let drawn = history.get(scope) ?? new Set();
  let remaining = all.filter((song) => !drawn.has(song.id));
  const newRound = remaining.length === 0;
  if (newRound) {
    drawn = new Set();
    remaining = all;
  }
  const song = remaining[Math.floor(Math.random() * remaining.length)];
  drawn.add(song.id);
  history.set(scope, drawn);
  result = { song, newRound };
  renderDraw();
});
updateOptions();
renderSongs();
renderDraw();

async function loadLatestSongs() {
  try {
    const response = await fetch("https://lili-songbook.easyarena3.chatgpt.site/api/songs", {
      credentials: "omit",
      signal: AbortSignal.timeout(4500),
    });
    if (!response.ok) return;
    const { songs: latest } = await response.json();
    if (!Array.isArray(latest) || !latest.every((song) => song &&
      Number.isSafeInteger(song.id) && typeof song.title === "string" &&
      typeof song.artist === "string") ||
      new Set(latest.map((song) => song.id)).size !== latest.length ||
      JSON.stringify(latest) === JSON.stringify(songs)) return;
    songs = latest;
    history.clear();
    result = null;
    updateOptions();
    renderSongs();
    renderDraw();
  } catch {
    // Show the published snapshot if the live source is unreachable.
  }
}

void loadLatestSongs();
</script>
</body>
</html>
