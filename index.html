<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北村歌單</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #56350e; background: #fff5cd; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; background: linear-gradient(135deg, #fff8dc, #fffacd 50%, #ffe4b5); }
  .photo-background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: url("./playlist-page-background.jpg") center 43% / cover no-repeat;
    opacity: .3;
  }
  main { position: relative; width: min(100% - 2rem, 66rem); margin: auto; padding: 2rem 0 3rem; }
  header { text-align: center; margin-bottom: 1.5rem; }
  h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: .2em 0 .4em; }
  h2, p { margin: 0; }
  label { display: grid; gap: .35rem; font-weight: 650; min-width: 0; }
  button, input, select, textarea { font: inherit; color: inherit; min-height: 2.75rem; padding: .55rem .8rem; border: 1px solid #e3ba6b; border-radius: .75rem; background: #fffdf4; }
  input, select, textarea { width: 100%; }
  textarea { resize: vertical; }
  button { font-weight: 650; cursor: pointer; }
  button:hover { background: #fff1b8; }
  button:disabled { opacity: .45; cursor: default; }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #966514; outline-offset: 2px; }
  .primary { background: #ffda72; border-color: #dbad40; }
  .primary:hover { background: #ffd259; }
  #open-draw { font-size: 1.15rem; padding-inline: 1.25rem; border-radius: 1rem; box-shadow: 0 .3rem 1rem #92561026; }
  .actions, .filters { display: flex; flex-wrap: wrap; gap: .65rem; align-items: end; }
  header .actions { justify-content: center; }
  .filters > label { flex: 1 1 13rem; }
  .count { margin: .8rem 0; }
  .playlist-marquee { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; padding: .45rem .6rem; border: 1px solid #e3ba6b; border-radius: .85rem; background: #fff4cbe8; }
  .marquee-window { flex: 1; min-width: 0; overflow: hidden; }
  .marquee-text { width: max-content; padding-inline-start: 100%; white-space: nowrap; font-weight: 650; animation: playlist-scroll var(--scroll-time, 20s) linear infinite; }
  @keyframes playlist-scroll { to { transform: translateX(-100%); } }
  #playlist-marquee {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: clamp(3.5rem, 8vw, 4.25rem);
    padding-block: .8rem;
  }
  #playlist-marquee[data-height="small"] { min-height: 2.75rem; padding-block: .55rem; }
  #playlist-marquee[data-height="large"] { min-height: clamp(4.5rem, 11vw, 5.75rem); padding-block: 1rem; }
  #marquee-text {
    font-size: clamp(1.12rem, 3.5vw, 1.35rem);
  }
  #playlist-marquee[data-size="small"] #marquee-text { font-size: 1rem; }
  #playlist-marquee[data-size="large"] #marquee-text { font-size: clamp(1.4rem, 5vw, 1.85rem); }
  #playlist-marquee[data-font="serif"] #marquee-text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; }
  #playlist-marquee[data-font="rounded"] #marquee-text { font-family: "Hiragino Maru Gothic ProN", "PingFang TC", "Microsoft JhengHei", ui-rounded, sans-serif; }
  #playlist-marquee[data-font="handwritten"] #marquee-text { font-family: "Kaiti TC", "DFKai-SB", "KaiTi", cursive; }
  @media (prefers-reduced-motion: reduce) {
    .marquee-text { animation: none; padding-inline-start: 0; width: auto; white-space: normal; overflow-wrap: anywhere; }
  }
  .announcements { margin-bottom: 1.4rem; padding: .9rem; border: 1px solid #e3ba6b; border-radius: 1rem; background: #fff4cbe8; }
  .announcements h2 { font-size: 1.2rem; margin-bottom: .65rem; }
  .announcement-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9rem), 1fr)); gap: .45rem; }
  .announcement-list .card { padding: .5rem .65rem; }
  .artist-directory { margin-top: 1rem; }
  .artist-directory summary { cursor: pointer; padding: .6rem .8rem; border: 1px solid #e3ba6b; border-radius: .75rem; background: #fffdf4; font-weight: 650; }
  .artist-directory summary:focus-visible { outline: 3px solid #966514; outline-offset: 2px; }
  .artist-directory summary span { margin-inline-start: .5rem; font-weight: 400; }
  .artist-directory:not([open]) .when-open, .artist-directory[open] .when-closed { display: none; }
  .artist-buttons { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: 1rem; }
  .artist-buttons button { border-radius: 999px; overflow-wrap: anywhere; max-width: 100%; }
  .artist-buttons button[aria-pressed="true"] { background: #ffda72; border-color: #a36d20; }
  ul { list-style: none; padding: 0; margin: 0; }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; }
  @media (min-width: 56rem) { .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .song-groups { display: grid; gap: 1.3rem; }
  .song-group h3 { font-size: 1.1rem; margin-bottom: .5rem; }
  .card { background: #fffdf7; border: 1px solid #f0d48e; border-radius: .85rem; padding: .75rem; min-width: 0; overflow-wrap: anywhere; }
  .song-title-row { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
  .draw-title-row { justify-content: center; }
  .copy-song-title { padding: .2rem .45rem; font-size: .8rem; min-height: 1.8rem; }
  .song-language { display: inline-block; margin-top: .35rem; padding: .1rem .45rem; font-size: .8rem; border: 1px solid #e3ba6b; border-radius: 999px; background: #fff1bd; color: #56350e; }
  .song-genre { margin-inline-start: .35rem; background: #fff0c8; }
  .card p, small { color: #735018; }
  dialog { width: min(100% - 2rem, 34rem); max-height: calc(100dvh - 2rem); border: 1px solid #e3ba6b; border-radius: 1rem; padding: 0; background: #fffdf4; color: inherit; box-shadow: 0 1rem 3rem #4c2a2039; }
  dialog::backdrop { background: #35250c70; }
  .dialog-heading { padding: 1rem; background: #ffe596; }
  .dialog-body { display: grid; gap: .85rem; padding: 1rem; }
  #draw-result { background: #fff1bc; border-radius: .85rem; padding: 1rem; text-align: center; overflow-wrap: anywhere; }
  #draw-preview { min-height: 6rem; padding: 1rem; border-radius: .85rem; background: #fff1bc; text-align: center; overflow-wrap: anywhere; }
  #draw-preview-title { display: block; margin-top: .35rem; animation: shuffle-pulse .16s ease-in-out infinite alternate; }
  @keyframes shuffle-pulse { from { opacity: .55; transform: translateY(3px); } to { opacity: 1; transform: translateY(-2px); } }
  #draw-result.reveal { animation: draw-reveal .25s ease-out; }
  @keyframes draw-reveal { from { opacity: .45; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { #draw-result.reveal, #draw-preview-title { animation: none; } }
  .draw-history { padding: .65rem .8rem; border: 1px solid #e3ba6b; border-radius: .75rem; }
  .draw-history summary { cursor: pointer; font-weight: 650; }
  .draw-history summary:focus-visible { outline: 3px solid #966514; outline-offset: 3px; }
  .draw-history ol { max-height: 12rem; overflow: auto; margin: .5rem 0 0; padding-inline-start: 1.65rem; }
  .draw-history li { padding-block: .3rem; overflow-wrap: anywhere; }
  #draw-result:empty, [hidden] { display: none !important; }
  #admin-list { display: grid; gap: .5rem; max-height: min(35vh, 21rem); overflow: auto; }
  #admin-list li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; }
  #admin-list li > div { min-width: 0; overflow-wrap: anywhere; }
  .status { color: #684710; }
  .bubbles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
  }

  /* Bubble element */
  .bubble {
    position: fixed;
    bottom: -50px;
    opacity: 0.8;
  }

  /* Float up animation - straight up */
  @keyframes floatUp {
    0% {
      transform: translateY(0) translateX(0);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-100vh) translateX(0);
      opacity: 0;
    }
  }

  /* Float up with sway - up with left-right movement */
  @keyframes floatUpSway {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0.8;
    }
    25% {
      transform: translateY(-25vh) translateX(30px) rotate(90deg);
      opacity: 0.8;
    }
    50% {
      transform: translateY(-50vh) translateX(-20px) rotate(180deg);
      opacity: 0.8;
    }
    75% {
      transform: translateY(-75vh) translateX(25px) rotate(270deg);
      opacity: 0.4;
    }
    100% {
      transform: translateY(-100vh) translateX(0) rotate(360deg);
      opacity: 0;
    }
  }

  /* Float up left - up and to the left */
  @keyframes floatUpLeft {
    0% {
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity: 0.8;
    }
    50% {
      transform: translateY(-50vh) translateX(-40px) rotate(180deg);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-100vh) translateX(-80px) rotate(360deg);
      opacity: 0;
    }
  }

  .cards .card { background: #fffdf7bb; }
  @media (prefers-reduced-motion: reduce) {
    .bubbles-container { display: none; }
  }
  /* Public playlist surfaces */
  :root {
    --ink: #472c1c;
    --line: #e8c585;
    --paper: #fffaf0f2;
    --panel-shadow: 0 10px 32px #46260c1a;
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { width: min(100% - 2rem, 68rem); padding-top: clamp(1rem, 4vw, 2.75rem); }
  .playlist-header {
    position: relative;
    display: grid;
    justify-items: center;
    isolation: isolate;
    overflow: hidden;
    min-height: clamp(14.8rem, 29vw, 19rem);
    align-content: space-between;
    gap: 1rem;
    padding: clamp(.8rem, 2.5vw, 1.5rem) 1rem clamp(.85rem, 3vw, 1.65rem);
    border: 1px solid #fff8ee;
    border-radius: 1.65rem;
    background: #48433d;
    box-shadow: 0 13px 37px #492d1020;
  }
  .playlist-header::before,
  .playlist-header::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  .playlist-header::before {
    z-index: -2;
    inset: 0;
    background: url("./playlist-background.jpg") center 31% / cover no-repeat;
  }
  .playlist-header::after {
    z-index: -1;
    inset: 0;
    background: linear-gradient(180deg, #21191150, transparent 38%, transparent 64%, #21191155);
  }
  @media (max-width: 37rem) {
    .playlist-header::before { background-position: center 26%; }
  }
  .playlist-title { display: grid; justify-items: center; gap: .65rem; }
  .playlist-header h1 {
    margin: 0;
    color: #fff;
    text-shadow: 0 2px 5px #211910d9, 0 3px 14px #211910a6;
    font: 800 clamp(2.2rem, 9vw, 5.1rem)/1.1 "Noto Serif TC", "Songti TC", "Microsoft JhengHei", serif;
    letter-spacing: .085em;
    text-align: center;
  }
  .playlist-header h1 span { color: inherit; }
  #open-draw {
    min-height: 3.3rem;
    min-width: min(13rem, 100%);
    padding-inline: 1.45rem;
    color: #29241f;
    border: 1px solid #ffffffbb;
    border-radius: 999px;
    background: #fffdf6ed;
    box-shadow: 0 9px 22px #85531338;
  }
  #open-draw:hover { background: #fff; }
  .playlist-marquee, .announcements, .song-filters, .library-heading {
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: var(--panel-shadow);
  }
  .playlist-marquee, .announcements { border-radius: 1.2rem; }
  .announcements { padding: clamp(.85rem,3vw,1.2rem); }
  .announcements h2 { font-size: 1.25rem; }
  .announcement-list { grid-template-columns: repeat(auto-fit,minmax(min(100%, 10.25rem),1fr)); gap: .6rem; }
  .announcement-list .card { background: #fff8e7; }
  .song-filters { padding: clamp(.8rem,3vw,1.15rem); border-radius: 1.2rem; }
  .filters { gap: .85rem; }
  .filters label { font-size: .95rem; }
  .filters input, .filters select { background: #fffef9; }
  .artist-directory { margin-top: .8rem; }
  .artist-directory summary { border-color: #e7cd9d; background: #fff5dd; }
  .artist-directory summary span { color: #735018; font-size: .85rem; }
  .library-heading { margin: 1.15rem 0 .8rem; padding: .65rem .9rem; border-radius: 1rem; display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; justify-content: space-between; }
  .library-heading h2 { font-size: 1.15rem; }
  .library-heading .count { margin: 0; color: #6a4727; font-size: .9rem; font-weight: 650; }
  .song-groups { gap: 1.25rem; }
  .song-group h3 { margin: 0 0 .55rem; width: fit-content; border: 1px solid #e3bd77; background: #fff0c7; border-radius: 999px; padding: .2rem .75rem; color: #583817; }
  .cards { gap: .7rem; }
  .cards .card, .announcement-list .card { border-color: #e8cfa0; border-radius: .95rem; }
  .cards .card { background: #fffaf0f5; box-shadow: 0 5px 16px #4b280e12; }
  .card strong, .card p { display: block; overflow-wrap: anywhere; }
  .card p { font-size: .89rem; }
  .card .song-title-row { column-gap: .45rem; justify-content: space-between; }
  .copy-song-title { color: #67411c; background: #fff7df; border-color: #dcc08d; }
  .copy-song-title:hover { background: #ffe8aa; }
  .song-language { background: #f8edda; border-color: #e5caa2; }
  dialog { border-radius: 1.4rem; box-shadow: 0 20px 65px #3d230947; }
  .dialog-heading { background: linear-gradient(120deg,#fff1c5,#ffdb85); }
  #draw-result, #draw-preview { border: 1px solid #edcb82; background: #fff3d2; }
  @media (max-width: 37rem) {
    main { width: min(100% - 1.15rem, 68rem); }
    .playlist-header { border-radius: 1.3rem; }
    .announcement-list { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .cards, .announcement-list { gap: .5rem; }
    .card { padding: .55rem; }
    .card .song-title-row { justify-content: flex-start; }
    .card .copy-song-title { min-height: 2rem; }
  }
  .radio-filters { display: grid; gap: .45rem; margin-bottom: .9rem; padding: .75rem; background: #faf2ddf7; border-color: #ead9ae; min-width: 0; }
  .screen-reader { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .radio-search { position: relative; display: block; }
  .radio-search input { height: 3.05rem; padding-inline: 2.65rem 1rem; border-radius: 999px; background: #fffdf8; border-color: #ded0c4; box-shadow: 0 3px 9px #4a301515; }
  .radio-search input::placeholder { color: #705b39; }
  .search-symbol { position: absolute; top: 1.03rem; left: 1.05rem; width: .73rem; height: .73rem; border: 1.5px solid #654c27; border-radius: 50%; pointer-events: none; }
  .search-symbol::after { content: ""; position: absolute; width: .33rem; height: 1.5px; background: #654c27; transform: rotate(48deg); transform-origin: left; left: .53rem; top: .54rem; }
  .filter-row { min-width: 0; --chip-bg: #624a22; --chip-color: #fffaf3; }
  .filter-row h2, .filter-row summary { font-size: .87rem; letter-spacing: .045em; color: #624c44; font-weight: 740; }
  .filter-row h2::before { content: ""; display: inline-block; width: .48rem; height: .48rem; border-radius: 50%; background: var(--chip-bg); margin-inline-end: .4rem; }
  .language-row { --chip-bg: #ead4a3; --chip-color: #543923; }
  .genre-row { --chip-bg: #e8ba57; --chip-color: #4b3213; }
  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: .3rem;
    margin-top: .2rem;
  }
  .filter-chips button { flex: 0 1 auto; max-width: 100%; overflow-wrap: anywhere; min-height: 2.45rem; padding: .32rem .68rem; border-radius: 999px; border: 1px solid #e4d5ca; background: #fffaf3; color: #523b34; white-space: normal; font-size: .87rem; }
  .filter-chips button[aria-pressed="true"] { background: var(--chip-bg); border-color: var(--chip-bg); color: var(--chip-color); }
  .filter-chips button:focus-visible { outline-offset: -2px; }
  .radio-filters .artist-directory { margin-top: 0; }
  .radio-filters .artist-directory summary { width: fit-content; padding: 0; background: transparent; border: 0; }
  .radio-filters .artist-directory summary span { font-size: .78rem; color: #745b55; }
  .artist-select { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; font-size: .85rem; }
  .artist-select select { width: auto; max-width: 100%; min-height: 2.4rem; padding-block: .2rem; background: #fffaf3; border-color: #e4d5ca; }
  .announcements { margin-bottom: .9rem; }
  @media (max-width: 37rem) {
    .playlist-header { border-radius: 1.2rem; }
    .radio-filters { padding: .65rem; }
    .artist-select select { flex: 1; min-width: 7rem; }
  }
  .site-sidebar { position: fixed; inset: .75rem auto auto .75rem; z-index: 20; color: #422e18; }
  .site-sidebar summary { cursor: pointer; width: fit-content; padding: .45rem .7rem; border: 1px solid #d7b66c; border-radius: .7rem; background: #fff8df; font-weight: 650; }
  .site-sidebar nav { margin-top: .4rem; border: 1px solid #d7b66c; border-radius: .8rem; background: #fff8df; box-shadow: 0 .4rem 1.5rem #452b2226; }
  .site-sidebar a { display: block; padding: .75rem 1.2rem; color: inherit; }
  .site-sidebar a + a { border-top: 1px solid #ead6ab; }
  .site-sidebar a:hover { background: #ffeec8; }
  .site-sidebar nav { overflow: hidden; }
  .search-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .6rem; }
  .search-results-link { display: grid; place-items: center; min-height: 3.05rem; padding-inline: .9rem; border: 1px solid #dbbf85; border-radius: .85rem; background: #fff8e2; color: #5d3b1d; font-size: .9rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
  .search-results-link:hover, #clear-filters:hover { background: #ffedbd; }
  .radio-filters > .filter-row { padding-top: .4rem; border-top: 1px solid #ead9b3; }
  .language-row, .genre-row { display: grid; grid-template-columns: 2.8rem minmax(0, 1fr); align-items: start; }
  .language-row h2, .genre-row h2 { padding-top: .6rem; white-space: nowrap; }
  .language-row .filter-chips, .genre-row .filter-chips { margin-top: 0; }
  .radio-filters .artist-directory summary { padding: .35rem .55rem; border: 1px solid #e5cea0; border-radius: .65rem; background: #fff9eb; }
  .filter-chips button { min-height: 2.35rem; padding-inline: .55rem; }
  .library-heading { align-items: center; scroll-margin-top: 4.25rem; }
  .library-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; }
  #clear-filters { min-height: 2.5rem; padding: .25rem .65rem; font-size: .85rem; }
  .songs-empty { padding: 1.25rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--paper); color: #6a4727; }
  .cards .card { display: grid; align-content: start; gap: .3rem; }
  .card .copy-song-title { min-height: 2.75rem; }
  @media (max-width: 24rem) {
    .search-results-link { padding-inline: .6rem; }
    .card .song-title-row { gap: .35rem; }
  }
</style>
</head>
<body>
<details id="site-menu" class="site-sidebar">
  <summary>☰ 選單</summary>
  <nav aria-label="側邊選單">
    <a href="https://lili-songbook.easyarena3.chatgpt.site/requests">存單查詢</a>
    <a href="https://lili-songbook.easyarena3.chatgpt.site/mailbox">學歌留言信箱</a>
  </nav>
</details>
<div class="photo-background" aria-hidden="true"></div>
<div id="floating-background" class="bubbles-container" aria-hidden="true"></div>
<main>
  <header class="playlist-header">
    <div class="playlist-title">
      <h1>北村<span>歌單</span></h1>
    </div>
    <div class="actions">
      <button id="open-draw" class="primary">🎲 隨機選歌</button>
    </div>
  </header>
  <section class="playlist-marquee" id="playlist-marquee" aria-label="第一條歌單留言" hidden>
    <div class="marquee-window"><p id="marquee-text" class="marquee-text"></p></div>
  </section>
  <section class="playlist-marquee" id="playlist-marquee-two" aria-label="第二條歌單留言" hidden>
    <div class="marquee-window"><p id="marquee-text-two" class="marquee-text"></p></div>
  </section>
  <section class="song-filters radio-filters" aria-label="歌單篩選">
    <div class="search-tools">
      <label class="radio-search">
        <span class="screen-reader">搜尋歌曲或歌手</span>
        <span class="search-symbol" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="搜尋歌名或歌手…" enterkeyhint="search">
      </label>
      <a class="search-results-link" href="#library-results">看歌曲</a>
    </div>
    <div class="filter-row language-row">
      <h2 id="language-filter-title">語言</h2>
      <div class="filter-chips" id="language-buttons" role="group" aria-labelledby="language-filter-title"></div>
    </div>
    <div class="filter-row genre-row">
      <h2 id="genre-filter-title">曲風</h2>
      <div class="filter-chips" id="genre-buttons" role="group" aria-labelledby="genre-filter-title"></div>
    </div>

      <summary>歌手 <span class="when-closed">展開</span><span class="when-open">收合</span></summary>

<script type="module">
const $ = (id) => document.getElementById(id);
const floatAnimations = ["floatUp", "floatUpSway", "floatUpLeft"];
const floatingItems = Array.from({ length: 25 }, (_, index) => {
  const item = document.createElement("span");
  item.className = "bubble";
  item.textContent = index % 2 === 0 ? "🌙" : "🧸";
  item.style.left = `${Math.random() * 100}%`;
  item.style.fontSize = `${0.8 + Math.random() * 1.5}rem`;
  const animation = floatAnimations[index % floatAnimations.length];
  const duration = 12 + Math.random() * 11;
  item.style.animation = `${animation} ${duration}s linear ${-Math.random() * duration}s infinite`;
  return item;
});
$("floating-background").append(...floatingItems);

const titleSegmenter = typeof Intl.Segmenter === "function" ? new Intl.Segmenter("zh-Hant") : null;

const englishGroup = "english";

function isEnglishTitle(title) {
  const letters = title.match(/\p{L}/gu);
  return Boolean(letters?.length && letters.every((letter) => /\p{Script=Latin}/u.test(letter)));
}

function groupOrder(group) {
  if (group === englishGroup) return Number.MAX_SAFE_INTEGER;
  return group || Infinity;
}

function titleLength(title) {
  const characters = titleSegmenter
    ? Array.from(titleSegmenter.segment(title), ({ segment }) => segment)
    : Array.from(title.normalize("NFC"));
  return characters.filter((character) => /[\p{L}\p{N}]/u.test(character)).length;
}

const seed = JSON.parse($("seed").textContent);
const genreOptions = ["抒情", "輕快", "動感舞曲", "搖滾", "饒舌", "古風"];
const languageOptions = ["中文", "台語", "粵語", "英文", "韓文", "日文", "越南文", "未分類"];
const filters = { language: "", genre: "" };
let hiddenLanguages = JSON.parse($("language-visibility-data").textContent);
const history = new Map();
const drawLog = [];
const drawDuration = 3500;
let drawFrame = 0;
let songs = seed;
let announcements = JSON.parse($("announcement-data").textContent);
const announcementDays = 30 * 24 * 60 * 60 * 1000;
let announcementTimer;
let result = null;

function element(tag, content, className) {
  const node = document.createElement(tag);
  if (content !== undefined) node.textContent = content;
  if (className) node.className = className;
  return node;
}

function artists(song) {
  return song.artist.split(/[\/,&]/).map((name) => name.trim()).filter(Boolean);
}

function matches(song, input) {
  const query = input.value.trim().toLocaleLowerCase();
  return [song.title, song.artist].some((value) => value.toLocaleLowerCase().includes(query));
}

function updateOptions() {
  const names = [...new Set(songs.flatMap(artists))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
  for (const id of ["artist", "scope"]) {
    const select = $(id);
    const value = select.value;
    select.replaceChildren(new Option("全部歌曲", ""), ...names.map((name) => new Option(name, name)));
    select.value = names.includes(value) ? value : "";
  }
  const artistCounts = new Map();
  for (const song of songs) {
    for (const artist of new Set(artists(song))) artistCounts.set(artist, (artistCounts.get(artist) ?? 0) + 1);
  }
  const prioritized = [...names].sort((a, b) => artistCounts.get(b) - artistCounts.get(a));
  $("artist-buttons").replaceChildren(...["", ...prioritized].map((name) => {
    const choice = button(name || "所有歌手", () => {
      $("artist").value = name;
      renderSongs();
    });
    choice.dataset.artist = name;
    return choice;
  }));
}

function button(label, onClick) {
  const node = element("button", label);
  node.type = "button";
  node.addEventListener("click", onClick);
  return node;
}

function copySongTitle(song) {
  const copy = button("複製", async () => {
    try {
      await navigator.clipboard.writeText(song.title);
      copy.textContent = "已複製";
      setTimeout(() => { copy.textContent = "複製"; }, 1600);
    } catch {
      copy.textContent = "複製失敗";
      setTimeout(() => { copy.textContent = "複製"; }, 2000);
    }
  });
  copy.className = "copy-song-title";
  copy.setAttribute("aria-label", `複製歌名：${song.title}`);
  return copy;
}

function renderSongCard(song) {
  const item = element("li", undefined, "card");
  const title = element("div", undefined, "song-title-row");
  title.append(element("strong", song.title), copySongTitle(song));
  item.append(title, element("p", song.artist),
    element("span", song.language || "未分類", "song-language"));
  if (song.genre) item.append(element("span", song.genre, "song-language song-genre"));
  return item;
}

function renderAnnouncements() {
  clearTimeout(announcementTimer);
  const remaining = announcements.lastAddedAt + announcementDays - Date.now();
  const songsById = new Map(songs.map((song) => [song.id, song]));
  const recent = remaining > 0
    ? [...announcements.ids].reverse().map((id) => songsById.get(id)).filter(Boolean)
    : [];
  if (remaining > 0) {
    announcementTimer = setTimeout(renderAnnouncements, Math.min(remaining, 2_147_483_647));
  }
  $("no-new-songs").hidden = recent.length > 0;
  $("new-songs").replaceChildren(...recent.map(renderSongCard));
}

function mountChips(id, options, filter, allLabel) {
  $(id).replaceChildren(...["", ...options].map((value) => {
    const choice = button(value || allLabel, () => {
      filters[filter] = value;
      renderSongs();
    });
    choice.dataset.value = value;
    return choice;
  }));
}

function renderSongs() {
  for (const [id, current] of [["language-buttons", filters.language], ["genre-buttons", filters.genre]]) {
    for (const choice of $(id).children) {
      choice.setAttribute("aria-pressed", String(choice.dataset.value === current));
    }
  }
  const group = $("artist").value;
  for (const choice of $("artist-buttons").children) {
    choice.setAttribute("aria-pressed", String(choice.dataset.artist === group));
  }
  const { language, genre } = filters;
  const active = Boolean(group || language || genre || $("search").value.trim());
  const visible = songs.filter((song) =>
    (!group || artists(song).includes(group)) && (!genre || song.genre === genre) &&
    (!language || (song.language || "未分類") === language) && matches(song, $("search"))
  );
  $("count").textContent = visible.length ? `共 ${visible.length} 首歌` : "找不到歌曲";
  $("library-title").textContent = active ? "搜尋結果" : "全部歌曲";
  $("clear-filters").hidden = !active;
  $("songs-empty").hidden = visible.length > 0;
  const groups = new Map();
  for (const song of visible) {
    const group = isEnglishTitle(song.title) ? englishGroup : titleLength(song.title);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(song);
  }
  const sections = [...groups.entries()].sort(([a], [b]) => groupOrder(a) - groupOrder(b));
  $("songs").replaceChildren(...sections.map(([group, entries]) => {
    const section = element("section", undefined, "song-group");
    const heading = element("h3", group === englishGroup ? "英文歌名" : group ? `${group} 字` : "其他");
    const cards = element("ul", undefined, "cards");
    cards.append(...entries.map(renderSongCard));
    section.append(heading, cards);
    return section;
  }));
}

function pool() {
  const scope = $("scope").value;
  return scope ? songs.filter((song) => artists(song).includes(scope)) : songs;
}

function renderDraw() {
  const remaining = pool().length - (history.get($("scope").value)?.size ?? 0);
  $("remaining").textContent = pool().length ? `本輪剩餘 ${remaining} / ${pool().length} 首` : "目前沒有可抽選的歌曲";
  $("draw-button").textContent = result ? "再抽一首" : "抽一首";
  $("draw-button").disabled = pool().length === 0;
  $("reset-draw").disabled = drawLog.length === 0;
  const panel = $("draw-result");
  panel.classList.remove("reveal");
  panel.replaceChildren();
  if (result) {
    const title = element("div", undefined, "song-title-row draw-title-row");
    title.append(element("h2", result.song.title), copySongTitle(result.song));
    panel.append(title, element("p", result.song.artist),
      element("small", `分類（歌手） ${artists(result.song).join("、")}`));
    if (result.newRound) panel.append(element("p", "已開始新一輪"));
  }
}

$("search").addEventListener("input", renderSongs);
$("search").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.isComposing) $("library-results").scrollIntoView({ block: "start" });
});
$("clear-filters").addEventListener("click", () => {
  filters.language = "";
  filters.genre = "";
  $("artist").value = "";
  $("search").value = "";
  renderSongs();
});
const siteMenu = $("site-menu");
document.addEventListener("click", (event) => {
  if (siteMenu.open && !siteMenu.contains(event.target)) siteMenu.open = false;
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && siteMenu.open) {
    siteMenu.open = false;
    siteMenu.querySelector("summary").focus();
  }
});
$("artist").addEventListener("change", renderSongs);
function renderLanguageFilters() {
  if (hiddenLanguages.includes(filters.language)) filters.language = "";
  mountChips("language-buttons", languageOptions.filter((language) => !hiddenLanguages.includes(language)), "language", "全部語言");
}

renderLanguageFilters();
mountChips("genre-buttons", genreOptions, "genre", "全部曲風");
$("open-draw").addEventListener("click", () => $("draw").showModal());
document.querySelectorAll("[data-close]").forEach((node) => {
  node.addEventListener("click", () => $(node.dataset.close).close());
});
$("scope").addEventListener("change", () => { result = null; renderDraw(); });
$("reset-draw").addEventListener("click", () => {
  history.clear();
  drawLog.length = 0;
  $("draw-history-list").replaceChildren();
  $("draw-history-count").textContent = "（0）";
  $("draw-history-empty").hidden = false;
  result = null;
  renderDraw();
});
function stopDrawAnimation() {
  if (!drawFrame) return;
  cancelAnimationFrame(drawFrame);
  drawFrame = 0;
  $("draw-preview").hidden = true;
  $("scope").disabled = false;
  renderDraw();
}

$("draw").addEventListener("close", stopDrawAnimation);
$("draw-button").addEventListener("click", () => {
  if (drawFrame) return;
  const scope = $("scope").value;
  const all = pool();
  if (!all.length) return;
  const previous = history.get(scope);
  const unseen = all.filter((song) => !previous?.has(song.id));
  const newRound = unseen.length === 0;
  const candidates = newRound ? all : unseen;
  const song = candidates[Math.floor(Math.random() * candidates.length)];

  function finish() {
    const drawn = newRound ? new Set() : previous ?? new Set();
    drawn.add(song.id);
    history.set(scope, drawn);
    result = { song, newRound };
    drawLog.push(song);
    $("draw-history-count").textContent = `（${drawLog.length}）`;
    $("draw-history-empty").hidden = true;
    const entry = element("li");
    const title = element("div", undefined, "song-title-row");
    title.append(element("span", `${song.title} — ${song.artist}`), copySongTitle(song));
    entry.append(title);
    $("draw-history-list").prepend(entry);
    renderDraw();
    $("draw-result").classList.add("reveal");
  }

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    finish();
    return;
  }

  $("draw-button").textContent = "抽選中…";
  $("draw-button").disabled = true;
  $("reset-draw").disabled = true;
  $("scope").disabled = true;
  $("draw-result").replaceChildren();
  $("draw-preview").hidden = false;
  const started = performance.now();
  let lastChange = -100;
  function shuffle(now) {
    if (!$("draw").open) {
      stopDrawAnimation();
      return;
    }
    const elapsed = now - started;
    if (elapsed >= drawDuration) {
      stopDrawAnimation();
      finish();
      return;
    }
    if (elapsed - lastChange >= 100 + 600 * (elapsed / drawDuration) ** 2) {
      lastChange = elapsed;
      const preview = candidates[Math.floor(Math.random() * candidates.length)];
      $("draw-preview-title").textContent = preview.title;
    }
    drawFrame = requestAnimationFrame(shuffle);
  }
  $("draw-preview-title").textContent = candidates[0].title;
  drawFrame = requestAnimationFrame(shuffle);
});
function renderMarquee(message, suffix = "") {
  const bar = $("playlist-marquee" + suffix);
  const text = $("marquee-text" + suffix);
  const value = message.trim().replace(/\s+/g, " ");
  if (text.textContent !== value) {
    text.textContent = value;
    text.style.setProperty("--scroll-time", `${Math.max(14, 11 + Array.from(value).length * .25)}s`);
  }
  bar.hidden = !value;
}

renderMarquee(JSON.parse($("playlist-message-data").textContent));
renderMarquee(JSON.parse($("playlist-message-two-data").textContent), "-two");
function renderMarqueeStyle(style) {
  const { dataset } = $("playlist-marquee");
  dataset.height = style.height;
  dataset.size = style.size;
  dataset.font = style.font;
}
renderMarqueeStyle(JSON.parse($("marquee-style-data").textContent));

updateOptions();
renderAnnouncements();
renderSongs();
renderDraw();

async function loadLatestSongs() {
  try {
    const response = await fetch("https://lili-songbook.easyarena3.chatgpt.site/api/songs", {
      credentials: "omit",
      signal: AbortSignal.timeout(4500),
    });
    if (!response.ok) return;
    const { songs: latest, announcements: notice, message, messageTwo, marqueeStyle, hiddenLanguages: settings } = await response.json();
    if (typeof message === "string") renderMarquee(message);
    if (typeof messageTwo === "string") renderMarquee(messageTwo, "-two");
    if (marqueeStyle) renderMarqueeStyle(marqueeStyle);
    if (!Array.isArray(latest) || !latest.every((song) => song &&
      Number.isSafeInteger(song.id) && typeof song.title === "string" &&
      typeof song.artist === "string") ||
      new Set(latest.map((song) => song.id)).size !== latest.length ||
      !notice || !Number.isSafeInteger(notice.lastAddedAt) || !Array.isArray(notice.ids) ||
      !notice.ids.every(Number.isSafeInteger)) return;
    if (Array.isArray(settings) && JSON.stringify(settings) !== JSON.stringify(hiddenLanguages)) {
      hiddenLanguages = settings;
      renderLanguageFilters();
    }
    announcements = notice;
    if (JSON.stringify(latest) === JSON.stringify(songs)) {
      renderSongs();
      renderAnnouncements();
      return;
    }
    stopDrawAnimation();
    songs = latest;
    history.clear();
    result = null;
    updateOptions();
    renderAnnouncements();
    renderSongs();
    renderDraw();
  } catch {
    // Show the published snapshot if the live source is unreachable.
  }
}

void loadLatestSongs();
</script>
