name: Sync public playlist to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/scripts/sync-playlist.mjs'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: public-playlist
          path: public-template
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache Unicode stroke data
        id: unihan
        uses: actions/cache@v4
        with:
          path: unihan
          key: unicode-unihan-strokes-17.0.0
      - name: Retrieve Unicode stroke data
        if: steps.unihan.outputs.cache-hit != 'true'
        run: |
          mkdir -p unihan
          curl --fail --silent --show-error --location --retry 3 --max-time 45 https://www.unicode.org/Public/17.0.0/ucd/Unihan.zip --output "$RUNNER_TEMP/Unihan.zip"
          unzip -q "$RUNNER_TEMP/Unihan.zip" Unihan_IRGSources.txt Unihan_DictionaryLikeData.txt -d unihan
      - name: Build the current songbook
        id: snapshot
        run: node .github/scripts/sync-playlist.mjs
      - uses: actions/configure-pages@v5
        if: steps.snapshot.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.snapshot.outputs.publish == 'true'
        with:
          path: site-dist
      - name: Wait for GitHub to list the uploaded artifact
        if: steps.snapshot.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q .; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub did not list the uploaded Pages artifact" >&2
          exit 1
      - uses: actions/deploy-pages@v4
        if: steps.snapshot.outputs.publish == 'true'
        id: deploy
        continue-on-error: true
      - name: Allow the uploaded artifact to become visible before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 15
      - uses: actions/deploy-pages@v4
        if: steps.deploy.outcome == 'failure'
        id: retry
