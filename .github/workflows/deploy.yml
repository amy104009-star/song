name: Sync public playlist to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/scripts/sync-playlist.mjs'
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: public-playlist
          path: public-template
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the current songbook
        id: snapshot
        run: node .github/scripts/sync-playlist.mjs
      - uses: actions/configure-pages@v5
        if: steps.snapshot.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@v4
        id: archive
        if: steps.snapshot.outputs.publish == 'true'
        with:
          path: site-dist
      - name: Publish the uploaded artifact
        id: deploy
        if: steps.snapshot.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.archive.outputs.artifact_id }}
        run: node .github/scripts/publish-pages.mjs
